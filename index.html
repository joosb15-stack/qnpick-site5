<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>큐엔픽</title>
  <meta name="description" content="질문으로 원하는 쿠팡템 찾기" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
    body { background: #179c52; color: white; }
    button { font: inherit; cursor: pointer; }

    .page { max-width: 1100px; margin: 0 auto; padding: 40px 16px 60px; }
    .top { text-align: center; margin-bottom: 36px; }
    .top h1 { margin: 0; font-size: 56px; font-weight: 800; }
    .top p { margin-top: 10px; color: rgba(255,255,255,0.82); }

    .question-box {
      max-width: 760px;
      margin: 0 auto;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.16);
      backdrop-filter: blur(8px);
    }

    .question-head {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .question-head h2 { margin: 6px 0 0; font-size: 32px; }
    .question-head p { margin: 10px 0 0; color: rgba(255,255,255,0.78); }
    .small-text { font-size: 14px; color: rgba(255,255,255,0.72); }

    .reset-btn {
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: white;
      border-radius: 16px;
      padding: 10px 16px;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .option-btn {
      min-height: 58px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 14px 16px;
      font-size: 16px;
      font-weight: 600;
    }

    .option-btn:hover, .reset-btn:hover { background: rgba(255,255,255,0.12); }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      overflow: hidden;
      background: white;
      color: #1f2937;
      border-radius: 24px;
    }

    .card img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 16px; }
    .badge-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: #179c52;
      color: white;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .price { color: #6b7280; font-size: 14px; }
    .card h3 { margin: 14px 0 8px; font-size: 22px; }
    .card p { margin: 0; line-height: 1.6; }

    .tag-row {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 12px;
      font-weight: 700;
    }

    .buy-btn {
      margin-top: 16px;
      width: 100%;
      border: none;
      border-radius: 16px;
      background: #179c52;
      color: white;
      padding: 13px 14px;
      font-weight: 700;
    }

    .featured-grid {
      max-width: 920px;
      margin: 26px auto 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .featured-card {
      border-radius: 28px;
      padding: 22px 18px;
      text-align: center;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.14);
    }

    .featured-label { margin: 0; color: rgba(255,255,255,0.72); font-size: 14px; }
    .featured-card h3 { margin: 10px 0 8px; font-size: 24px; }
    .featured-card p:last-of-type { color: rgba(255,255,255,0.85); line-height: 1.6; }

    .featured-btn {
      margin-top: 16px;
      width: 100%;
      border: none;
      border-radius: 16px;
      background: white;
      color: #179c52;
      padding: 13px 14px;
      font-weight: 800;
    }

    @media (max-width: 820px) {
      .question-head { flex-direction: column; }
      .result-grid, .featured-grid, .option-grid { grid-template-columns: 1fr; }
      .top h1 { font-size: 42px; }
      .question-head h2 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <h1>큐엔픽</h1>
      <p>질문으로 원하는 쿠팡템 찾기</p>
    </div>

    <div class="question-box">
      <div class="question-head">
        <div>
          <div class="small-text" id="progressText"></div>
          <h2 id="questionTitle"></h2>
          <p id="questionSubtitle"></p>
        </div>
        <button class="reset-btn" id="resetBtn">다시하기</button>
      </div>
      <div id="contentArea"></div>
    </div>

    <div class="featured-grid" id="featuredGrid"></div>
  </div>

 <script>
  const QUESTIONS = [
    {
      id: "category",
      title: "무엇에 관한 걸 찾고 있나요?",
      subtitle: "큰 카테고리부터 골라주세요",
      options: [
        { label: "집", categoryKey: "home" },
        { label: "차", categoryKey: "car" },
        { label: "선물", categoryKey: "gift" },
        { label: "공부", categoryKey: "study" },
        { label: "어린이", categoryKey: "kids" },
        { label: "놀이", categoryKey: "toy" },
        { label: "회사", categoryKey: "office" },
        { label: "운동", categoryKey: "fitness" },
        { label: "여행", categoryKey: "travel" },
        { label: "랜덤", categoryKey: "random" },
      ],
    },
    {
      id: "budget",
      title: "예산은 어느 정도예요?",
      subtitle: "대충 이 정도로 생각해도 돼요",
      options: [
        { label: "1만원 이하", budgetKey: "low" },
        { label: "3만원 이하", budgetKey: "mid" },
        { label: "5만원 이하", budgetKey: "midHigh" },
        { label: "10만원 이상도 가능", budgetKey: "high" },
        { label: "랜덤", budgetKey: "random" },
      ],
    },
    {
      id: "priceStyle",
      title: "어떤 느낌을 원해요?",
      subtitle: "가성비를 볼지, 돈값 하는 걸 볼지 골라주세요",
      options: [
        { label: "무조건 가성비", priceKey: "cheap" },
        { label: "적당히 괜찮은 거", priceKey: "balanced" },
        { label: "비싸도 좋으면 됨", priceKey: "premium" },
        { label: "랜덤", priceKey: "random" },
      ],
    },
    {
      id: "visualStyle",
      title: "원하는 물건 스타일은 뭐예요?",
      subtitle: "겉으로 보이는 느낌도 중요하죠",
      options: [
        { label: "깔끔한 느낌", styleKey: "simple" },
        { label: "화려한 느낌", styleKey: "flashy" },
        { label: "귀여운 느낌", styleKey: "cute" },
        { label: "실용적인 느낌", styleKey: "useful" },
        { label: "감성 있는 느낌", styleKey: "pretty" },
        { label: "랜덤", styleKey: "random" },
      ],
    },
  ];

  const PRODUCTS = [
   

  ];

  let step = 0;
  let answers = [];

  function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
  }

  function pickFeaturedProducts(result) {
    if (!PRODUCTS.length) return [];
    if (!result || !result.matchedProducts.length) return PRODUCTS.slice(0, 3);
    return result.matchedProducts.slice(0, 3);
  }

  function currentResult() {
    const isFinished = answers.length === QUESTIONS.length;
    if (!isFinished) return null;

    const categoryAnswer = answers.find((answer) => answer.categoryKey);
    const selectedCategory = categoryAnswer?.categoryKey || "random";

    const budgetAnswer = answers.find((answer) => answer.budgetKey);
    const selectedBudget = budgetAnswer?.budgetKey || "random";

    const priceAnswer = answers.find((answer) => answer.priceKey);
    const selectedPriceType = priceAnswer?.priceKey || "random";

    const styleAnswer = answers.find((answer) => answer.styleKey);
    const selectedStyleType = styleAnswer?.styleKey || "random";

    let matchedProducts = PRODUCTS.filter((product) => {
      const categoryMatch =
        selectedCategory === "random" || product.category === selectedCategory;

      const budgetMatch =
        selectedBudget === "random" || product.budget === selectedBudget;

      const priceMatch =
        selectedPriceType === "random" || product.priceType === selectedPriceType;

      const styleMatch =
        selectedStyleType === "random" || product.styleType === selectedStyleType;

      return categoryMatch && budgetMatch && priceMatch && styleMatch;
    });

    const hasAnyRandom =
      selectedCategory === "random" ||
      selectedBudget === "random" ||
      selectedPriceType === "random" ||
      selectedStyleType === "random";

    if (hasAnyRandom) {
      matchedProducts = shuffle(matchedProducts);
    }

    matchedProducts = matchedProducts.slice(0, 6);

    return {
      selectedCategory,
      selectedBudget,
      selectedPriceType,
      selectedStyleType,
      matchedProducts,
    };
  }

  function renderQuestion(question, contentArea) {
    contentArea.innerHTML =
      '<div class="option-grid">' +
      question.options
        .map(
          (option) =>
            `<button class="option-btn" data-label="${option.label}">${option.label}</button>`
        )
        .join("") +
      "</div>";

    contentArea.querySelectorAll(".option-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const option = question.options.find((o) => o.label === btn.dataset.label);
        answers.push(option);
        step += 1;
        render();
      });
    });
  }

  function renderResults(result, contentArea) {
    if (!result || !result.matchedProducts.length) {
      contentArea.innerHTML = `
        <div style="background:white; color:#1f2937; border-radius:24px; padding:24px; text-align:center;">
          <h3 style="margin:0 0 10px; font-size:24px;">조건에 맞는 상품이 아직 없어요</h3>
          <p style="margin:0; color:#6b7280; line-height:1.6;">
            PRODUCTS 배열에 상품을 추가하거나,<br />
            예산 / 가격스타일 / 스타일 조건을 넓혀보세요.
          </p>
        </div>
      `;
      return;
    }

    contentArea.innerHTML =
      '<div class="result-grid">' +
      result.matchedProducts
        .map(
          (product, index) => `
          <div class="card">
            <img src="${product.image}" alt="${product.name}">
            <div class="card-body">
              <div class="badge-row">
                <span class="badge">추천 ${index + 1}</span>
                <span class="price">${product.price}</span>
              </div>
              <h3>${product.name}</h3>
              <p>${product.reason}</p>
              <div class="tag-row">
                ${(product.tags || [])
                  .map((tag) => `<span class="tag">#${tag}</span>`)
                  .join("")}
              </div>
              <a href="${product.link}" target="_blank" rel="noreferrer">
                <button class="buy-btn">쿠팡에서 보기</button>
              </a>
            </div>
          </div>
        `
        )
        .join("") +
      "</div>";
  }

  function renderFeatured(featuredProducts) {
    const featuredGrid = document.getElementById("featuredGrid");

    if (!featuredProducts.length) {
      featuredGrid.innerHTML = `
        <div class="featured-card">
          <p class="featured-label">쿠팡파트너스</p>
          <h3>상품을 추가해 주세요</h3>
          <p>PRODUCTS 배열에 상품을 넣으면 여기에 자동으로 표시돼요</p>
        </div>
      `;
      return;
    }

    featuredGrid.innerHTML = featuredProducts
      .map(
        (product) => `
        <div class="featured-card">
          <p class="featured-label">쿠팡파트너스</p>
          <h3>오늘 가장 잘 나가는 추천</h3>
          <p>${product.name}</p>
          <a href="${product.link}" target="_blank" rel="noreferrer">
            <button class="featured-btn">보러가기</button>
          </a>
        </div>
      `
      )
      .join("");
  }

  function render() {
    const progressText = document.getElementById("progressText");
    const questionTitle = document.getElementById("questionTitle");
    const questionSubtitle = document.getElementById("questionSubtitle");
    const contentArea = document.getElementById("contentArea");

    const isFinished = answers.length === QUESTIONS.length;
    const question = QUESTIONS[step];
    const result = currentResult();
    const featuredProducts = pickFeaturedProducts(result);

    progressText.textContent = isFinished
      ? "추천 완료"
      : `질문 ${step + 1} / ${QUESTIONS.length}`;

    questionTitle.textContent = isFinished
      ? "당신한테 맞는 추천 결과"
      : question.title;

    questionSubtitle.textContent = isFinished ? "" : question.subtitle;

    if (!isFinished) {
      renderQuestion(question, contentArea);
    } else {
      renderResults(result, contentArea);
    }

    renderFeatured(featuredProducts);
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    step = 0;
    answers = [];
    render();
  });

  render();
</script>
</body>
</html>
